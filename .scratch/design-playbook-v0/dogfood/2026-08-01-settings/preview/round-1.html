<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>系统设置 — round-1 原型</title>
<style>
  :root { --bg:#f4f2ed; --panel:#fff; --line:#ddd6c8; --text:#2c2a26; --muted:#8a8375; --accent:#7a5f30; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:12px 22px; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0; }
  main { max-width:640px; margin:20px auto; padding:0 22px; }
  .group { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:16px; overflow:hidden; }
  .group h2 { font-size:13px; color:var(--muted); padding:10px 16px 4px; margin:0; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:1px solid var(--line); }
  .row label { flex:1; }
  .row .helper { color:var(--muted); font-size:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 16px; cursor:pointer; font-family:inherit; }
  .switch { width:44px; height:24px; border-radius:12px; background:#c9c2b2; position:relative; cursor:pointer; flex:none; }
  .switch::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s; }
  .switch[aria-checked="true"] { background:var(--accent); }
  .switch[aria-checked="true"]::after { left:22px; }
  select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-family:inherit; }
</style>
</head>
<body data-state="ready">
<header>
  <h1>设置</h1>
  <span id="status" role="status" style="margin-left:auto;color:var(--muted);font-size:12px">未保存</span>
</header>
<main>
  <section class="group">
    <h2>外观</h2>
    <div class="row"><label for="dark">深色模式 <span class="helper">深色背景降低夜间干扰</span></label>
      <div class="switch" id="dark" role="switch" aria-checked="false" tabindex="0" aria-label="深色模式"></div></div>
  </section>
  <section class="group">
    <h2>通知</h2>
    <div class="row"><label for="notify">桌面通知 <span class="helper">关键事件弹窗提醒</span></label>
      <div class="switch" id="notify" role="switch" aria-checked="true" tabindex="0" aria-label="桌面通知"></div></div>
  </section>
  <section class="group">
    <h2>系统</h2>
    <div class="row"><label for="auto">自动更新 <span class="helper">夜间静默安装</span></label>
      <div class="switch" id="auto" role="switch" aria-checked="false" tabindex="0" aria-label="自动更新"></div></div>
  </section>
  <section class="group">
    <h2>语言</h2>
    <div class="row"><label for="lang">界面语言</label>
      <select id="lang" aria-label="界面语言"><option>简体中文</option><option>English</option></select></div>
  </section>
  <div style="display:flex;gap:10px">
    <button id="save">保存</button>
    <button id="reset">重置</button>
  </div>
</main>
</body>
</html>
