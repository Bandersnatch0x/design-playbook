name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to recover"
        required: true
        type: string
      recovery:
        description: "Recover both-npm-published / GitHub-Release-missing state"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery || false }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"

      - name: Pin Trusted Publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.19.0"

      - name: Resolve and bind release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${TAG}" 2>/dev/null || true)"
          git fetch origin main:refs/remotes/origin/main --no-tags
          MAIN_COMMIT="$(git rev-parse refs/remotes/origin/main)"
          HEAD_IS_ANCESTOR=false
          if git merge-base --is-ancestor "${HEAD_COMMIT}" "${MAIN_COMMIT}"; then
            HEAD_IS_ANCESTOR=true
          fi
          python3 scripts/release_transaction.py identity \
            --tag "${TAG}" \
            --manifest packages/design-playbook/package.json \
            --head-commit "${HEAD_COMMIT}" \
            --tag-commit "${TAG_COMMIT}" \
            --main-commit "${MAIN_COMMIT}" \
            --head-is-ancestor "${HEAD_IS_ANCESTOR}" \
            --recovery "${RECOVERY}" \
            --notes "docs/releases/${TAG}.md" \
            >> "${GITHUB_OUTPUT}"

      - name: Validate release entry point
        run: >-
          python3 scripts/release_state.py mode
          --event-name "${GITHUB_EVENT_NAME}"
          --recovery "${RECOVERY}"

      - name: Install release test dependencies
        run: |
          RUFF_VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from _checks import RUFF_VERSION; print(RUFF_VERSION)")
          python3 -m pip install --disable-pip-version-check pytest playwright pyyaml==6.0.2 "ruff==${RUFF_VERSION}"
          python3 -m playwright install --with-deps chromium

      - name: Run release gates
        run: python3 scripts/release.py

      - name: Run full test suite
        run: python3 -m pytest -q

      - name: Inspect npm artifact
        working-directory: packages/design-playbook
        run: npm pack --dry-run

      - name: Check GitHub Release state
        id: github-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)"
          STATUS=$?
          set -e

          if [[ ${STATUS} -eq 0 ]]; then
            EXISTS=true
          elif grep -Fq "HTTP 404" <<<"${OUTPUT}"; then
            EXISTS=false
          else
            echo "::error::GitHub Release preflight failed"
            printf '%s\n' "${OUTPUT}"
            exit ${STATUS}
          fi
          echo "exists=${EXISTS}" >> "${GITHUB_OUTPUT}"

      - name: Check npm registry state
        id: registry
        run: |
          set +e
          python3 scripts/release_transaction.py registry-state \
            --package "${{ steps.release.outputs.package_name }}" \
            --version "${{ steps.release.outputs.version }}" \
            > registry-state.txt
          STATUS=$?
          set -e
          cat registry-state.txt
          if [[ ${STATUS} -ne 0 ]]; then exit ${STATUS}; fi
          cat registry-state.txt >> "${GITHUB_OUTPUT}"

      - name: Validate public release state transition
        id: state
        env:
          EVENT_NAME: ${{ github.event_name }}
          NPM_EXISTS: ${{ steps.registry.outputs.exists }}
          GITHUB_RELEASE_EXISTS: ${{ steps.github-state.outputs.exists }}
        run: |
          python3 scripts/release_state.py state \
            --event-name "${EVENT_NAME}" \
            --recovery "${RECOVERY}" \
            --npm-exists "${NPM_EXISTS}" \
            --github-release-exists "${GITHUB_RELEASE_EXISTS}" \
            >> "${GITHUB_OUTPUT}"

      - name: Publish npm package with OIDC
        if: steps.state.outputs.action == 'publish'
        working-directory: packages/design-playbook
        run: npm publish --access public

      - name: Verify npm registry
        run: >-
          python3 scripts/release_transaction.py wait-registry
          --package "${{ steps.release.outputs.package_name }}"
          --version "${{ steps.release.outputs.version }}"
          --attempts 18
          --interval 5

      - name: Verify npm provenance
        run: >-
          python3 scripts/release_transaction.py verify-provenance
          --package "${{ steps.release.outputs.package_name }}"
          --version "${{ steps.release.outputs.version }}"
          --attempts 3
          --interval 20

      - name: Verify dsh-design-playbook registry
        timeout-minutes: 36
        run: >-
          python3 scripts/release_transaction.py wait-registry
          --package dsh-design-playbook
          --version "${{ steps.release.outputs.version }}"
          --attempts 180
          --interval 10

      - name: Verify dsh-design-playbook provenance
        run: >-
          python3 scripts/release_transaction.py verify-provenance
          --package dsh-design-playbook
          --version "${{ steps.release.outputs.version }}"
          --attempts 3
          --interval 20

      - name: npm publish summary
        shell: bash
        run: |
          {
            echo "## npm publish"
            echo ""
            echo "- package: ${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.version }}"
            echo "- tag: ${{ steps.release.outputs.tag }}"
            echo "- preexisting: ${{ steps.registry.outputs.exists }}"
            echo "- action: ${{ steps.state.outputs.action }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  github-release:
    name: Create shared GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
      RELEASE_TITLE: ${{ needs.publish.outputs.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Create GitHub Release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          NOTES="docs/releases/${RELEASE_TAG}.md"
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES}"
          echo "status=created" >> "${GITHUB_OUTPUT}"

      - name: GitHub Release summary
        shell: bash
        run: |
          {
            echo "## GitHub Release"
            echo ""
            echo "- tag: ${RELEASE_TAG}"
            echo "- status: ${{ steps.release.outputs.status }}"
            echo "- url: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
