name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin (static + MCP stdio contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install workflow contract dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Validate
        run: python3 scripts/validate.py
      - name: Cross-document link self-check (vNext S6)
        run: python3 scripts/check_doc_links.py
      - name: Doctor (skip floor self-check for speed)
        run: python3 scripts/doctor.py --skip-self-check
      - name: Validate run seam
        run: python3 packages/design-playbook/tests/test_validate_run.py
      - name: Release / doctor / run-status / design-baseline unit tests
        run: |
          python3 tests/test_release.py
          python3 tests/test_doctor.py
          python3 tests/test_run_status.py
          python3 tests/test_run_facts_snapshot.py
          python3 tests/test_stages_registry.py
          python3 tests/test_design_baseline.py
          python3 tests/test_validate.py
          python3 tests/test_aggregate_runs.py
          python3 tests/test_normalize_lockstep.py
          python3 tests/test_install_smoke.py
          python3 tests/test_release_workflow.py
          python3 tests/test_release_transaction.py
          python3 tests/test_vnext_s1.py
          python3 tests/test_vnext_s2.py
          python3 tests/test_vnext_s3.py
          python3 tests/test_vnext_s4.py
          python3 tests/test_vnext_s5.py
          python3 tests/test_vnext_s6.py
      - name: Queue monitor dialog state tests
        run: node packages/design-playbook/showcase/test_queue_monitor_state.js

      - name: Syntax check (all Python)
        # py_compile is the always-on syntax gate. The MCP stdio suites now
        # also run as required gates below (ticket 06): preview mocks its
        # browser layer (no chromium); evidence is split into a no-chromium
        # pure-path group (contract/path validation) and a chromium capture
        # group (real-browser screenshots / a11y / trace). py_compile still
        # catches import/syntax regressions on the server launchers before
        # the heavier stdio runs kick in.
        run: |
          python3 -m py_compile \
            packages/design-playbook/mcp/preview/server.py \
            packages/design-playbook/mcp/preview/integrity.py \
            packages/design-playbook/mcp/preview/transaction.py \
            packages/design-playbook/mcp/preview/versions.py \
            packages/design-playbook/mcp/evidence/server.py \
            packages/design-playbook/mcp/evidence/capture_contract.py \
            packages/design-playbook/mcp/test_transport.py \
            packages/design-playbook/mcp/preview/test_integrity.py \
            packages/design-playbook/mcp/preview/test_server_stdio.py \
            packages/design-playbook/mcp/preview/test_transaction.py \
            packages/design-playbook/mcp/preview/test_versions.py \
            packages/design-playbook/mcp/evidence/test_server_stdio.py \
            packages/design-playbook/mcp/evidence/test_capture_contract.py \
            packages/design-playbook-preview/server.py \
            packages/design-playbook-evidence/server.py \
            scripts/validate.py \
            scripts/check_doc_links.py \
            packages/design-playbook/scripts/rules_registry.py \
            packages/design-playbook/scripts/rules_governance.py \
            packages/design-playbook/scripts/learning_candidates.py \
            scripts/release.py \
            scripts/release_state.py \
            scripts/release_transaction.py \
            scripts/doctor.py \
            scripts/install_smoke.py \
            packages/design-playbook/skills/design-baseline/scripts/design_baseline.py \
            tests/test_release.py \
            tests/test_doctor.py \
            tests/test_run_status.py \
            tests/test_stages_registry.py \
            tests/test_design_baseline.py \
            tests/test_validate.py \
            tests/test_aggregate_runs.py \
            tests/test_normalize_lockstep.py \
            tests/test_install_smoke.py \
            tests/test_release_workflow.py \
            tests/test_release_transaction.py \
            tests/test_run_facts_snapshot.py \
            tests/test_vnext_s1.py \
            tests/test_vnext_s2.py \
            tests/test_vnext_s3.py \
            tests/test_vnext_s4.py \
            tests/test_vnext_s5.py \
            tests/test_vnext_s6.py \
            packages/design-playbook/tests/test_queue_monitor.py \
            packages/design-playbook/scripts/validate_run.py \
            packages/design-playbook/scripts/g1_spec.py \
            packages/design-playbook/scripts/g2_g4_pointback.py \
            packages/design-playbook/scripts/g5_preview.py \
            packages/design-playbook/scripts/g6_evidence.py \
            packages/design-playbook/scripts/g6_records.py \
            packages/design-playbook/scripts/g6_warnings.py \
            packages/design-playbook/scripts/g9_shaping.py \
            packages/design-playbook/scripts/g10_design_decisions.py \
            packages/design-playbook/scripts/g11_coverage.py \
            packages/design-playbook/scripts/g8_run_registry.py \
            packages/design-playbook/scripts/method_semantics.py \
            packages/design-playbook/scripts/interaction_dimensions.py \
            packages/design-playbook/scripts/dd_entries.py \
            packages/design-playbook/scripts/shaping_log.py \
            packages/design-playbook/scripts/run_profile.py \
            packages/design-playbook/scripts/repair_rounds.py \
            packages/design-playbook/scripts/escalation_signals.py \
            packages/design-playbook/scripts/g12_tier_boundary.py \
            packages/design-playbook/scripts/stages.py \
            packages/design-playbook/scripts/run_status.py \
            packages/design-playbook/design_playbook.py \
            packages/design-playbook/scripts/__init__.py

      # ----------------------------------------------------------------
      # ticket 06: MCP stdio gates (required, merge-blocking).
      #   - Preview transaction + stdio: fake collector/local HTTP; no chromium.
      #   - Evidence stdio pure-path: contract/path validation that never
      #     reaches `from playwright.sync_api import sync_playwright`; runs
      #     with or without chromium (always required).
      #   - Evidence stdio capture: real-browser captures; needs chromium.
      #   - Playwright chromium install is the DEFAULT path. If the install
      #     step fails, the capture group is skipped-with-reason AND the gate
      #     is marked red (never silent green). See ticket 06 decision (b).
      # ----------------------------------------------------------------

      - name: Install pytest (for stdio gates)
        run: python3 -m pip install pytest

      - name: Shared transport + Preview transaction/stdin tests (required)
        run: |
          python3 -m pytest \
            packages/design-playbook/mcp/test_transport.py \
            packages/design-playbook/mcp/preview/test_integrity.py \
            packages/design-playbook/mcp/preview/test_transaction.py \
            packages/design-playbook/mcp/preview/test_versions.py \
            packages/design-playbook/mcp/preview/test_server_stdio.py \
            packages/design-playbook/mcp/evidence/test_capture_contract.py \
            -v

      - name: Evidence MCP stdio — pure-path tests (required, no Playwright)
        # Direct runtime tests cover argument rejection, containment,
        # run-root warnings, and overwrite behavior through
        # execute_capture_plan with a fake browser adapter. Narrow stdio tests
        # cover only schema and JSON-RPC transport behavior. Neither needs
        # Chromium.
        # Selection is by class name (review item M3): every test in
        # EvidencePurePathTests runs here; EvidenceCaptureTests runs in the
        # chromium gate below. Unlike the previous -k keyword OR-list, new
        # tests are picked up automatically by their class — no
        # hand-maintained list to silently drift out of sync (the old list
        # silently skipped any new test whose name matched no keyword).
        # Note: -k PurePathTests (not -k Capture on the other gate) because
        # `test_tools_list_exposes_execute_capture_plan` is a pure-path
        # test whose method name contains "capture"; filtering on the full
        # class-name suffix keeps the two groups disjoint.
        run: |
          python3 -m pytest packages/design-playbook/mcp/evidence/test_server_stdio.py -v \
            -k PurePathTests

      - name: Install Playwright + chromium (ticket 06 default path)
        id: pw_install
        continue-on-error: true
        # chromium install method confirmed by ticket 05 codex_exec smoke
        # (2026-07-22 PASS). Standard `playwright install --with-deps
        # chromium` on ubuntu-latest (passwordless sudo for --with-deps
        # apt libs). If the runner image or base changes, revisit.
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Evidence MCP stdio — capture tests (require chromium)
        if: steps.pw_install.outcome == 'success'
        # Real-browser captures: screenshot, a11y tree, interaction trace,
        # select_option, failure paths, overwrite opt-in. Requires the
        # Playwright + chromium install step above to have succeeded.
        # Selection by class name (review item M3): EvidenceCaptureTests.
        run: |
          python3 -m pytest packages/design-playbook/mcp/evidence/test_server_stdio.py -v \
            -k CaptureTests

      - name: Playwright missing — skip-with-reason, mark gate red
        if: steps.pw_install.outcome != 'success'
        # Decision (b): CI installs chromium by default. On missing, the
        # capture group is SKIPPED with a printed reason and this gate is
        # marked RED — never silent green. The pure-path group above still
        # ran and is required independent of chromium availability.
        run: |
          echo "::error::Playwright/chromium install failed; Evidence capture tests skipped-with-reason."
          echo "Per ticket 06 decision (b): CI installs chromium by default."
          echo "On missing, the chromium capture group is skipped and this gate"
          echo "is marked red (NOT silent green). Pure-path Evidence tests already ran."
          exit 1

      - name: Frontend floor (ADR-0008 JS verification, required)
        # Graduated after the Playwright install and Evidence capture group
        # ran green on main (run 30165093470). This exercises the preview
        # control's browser-side submit/readiness contract.
        if: steps.pw_install.outcome == 'success'
        run: |
          python3 packages/design-playbook/tests/test_floor_frontend.py \
            | tee /tmp/frontend-floor.log
          grep -Fx "FRONTEND FLOOR TEST PASSED" /tmp/frontend-floor.log

      - name: Queue monitor dialog timer races (require chromium)
        if: steps.pw_install.outcome == 'success'
        run: |
          python3 -m pytest \
            packages/design-playbook/tests/test_queue_monitor.py \
            -v

      - name: Preview canvas version-control e2e (require chromium)
        if: steps.pw_install.outcome == 'success'
        run: |
          python3 -c "from playwright.sync_api import sync_playwright"
          python3 -m pytest \
            packages/design-playbook/tests/test_e2e_canvas_vc.py \
            -v
