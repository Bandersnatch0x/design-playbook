name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin (static + MCP stdio contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install workflow contract and lint dependencies
        run: |
          RUFF_VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from _checks import RUFF_VERSION; print(RUFF_VERSION)")
          python3 -m pip install --disable-pip-version-check pyyaml==6.0.2 "ruff==${RUFF_VERSION}"
      - name: Validate
        run: python3 scripts/validate.py
      - name: Cross-document link self-check (vNext S6)
        run: python3 scripts/check_doc_links.py
      - name: Doctor (skip floor self-check for speed)
        run: python3 scripts/doctor.py --skip-self-check
      - name: Validate run seam
        run: python3 packages/design-playbook/tests/test_validate_run.py
      - name: Release / doctor / run-status / design-baseline unit tests
        run: |
          python3 tests/test_release.py
          python3 tests/test_doctor.py
          python3 tests/test_run_status.py
          python3 tests/test_t001_capability_receipt.py
          python3 tests/test_t002_run_status_continuation.py
          python3 tests/test_t004_run_handoff.py
          python3 tests/test_t006_continuation_acceptance_matrix.py
          python3 tests/test_run_facts_snapshot.py
          python3 tests/test_stages_registry.py
          python3 tests/test_design_baseline.py
          python3 tests/test_reference_intake_fixtures.py
          python3 tests/test_reference_sources.py
          python3 tests/test_request_routing.py
          python3 tests/test_codex_workflow_prompt.py
          python3 tests/test_plan_handoff_prompt.py
          python3 tests/test_audit_preferences.py
          python3 tests/test_audit_preferences_prose.py
          python3 tests/test_audit_skeleton.py
          python3 tests/test_audit_writeback.py
          python3 tests/test_validate.py
          python3 tests/test_aggregate_runs.py
          python3 tests/test_normalize_lockstep.py
          python3 tests/test_install_smoke.py
          python3 tests/test_plugin_dir_smoke.py
          python3 tests/test_adapter_generator.py
          python3 tests/test_host_scenario.py
          python3 tests/test_release_workflow.py
          python3 tests/test_release_transaction.py
          python3 tests/test_vnext_s1.py
          python3 tests/test_vnext_s2.py
          python3 tests/test_vnext_s3.py
          python3 tests/test_vnext_s4.py
          python3 tests/test_vnext_s5.py
          python3 tests/test_vnext_s6.py
          python3 tests/test_operator_evidence_hardening.py
          python3 tests/test_project_target.py
          python3 tests/test_adapter_drift.py
          python3 tests/test_component_backflow_e2e.py
          python3 tests/test_component_candidates.py
          python3 tests/test_design_baseline_promote.py
          python3 tests/test_promotion_governance.py
          python3 tests/test_run_metadata.py
      - name: Queue monitor dialog state tests
        run: node packages/design-playbook/showcase/test_queue_monitor_state.js

      - name: Syntax check (all tracked Python)
        # Keep syntax inventory dynamic so lower stacked PRs never reference
        # files introduced only by a later stack layer. validate.py owns Ruff
        # via scripts/_checks.py; this gate only guarantees compile.
        run: python3 -m py_compile $(git ls-files '*.py')


      # ----------------------------------------------------------------
      # ticket 06: MCP stdio gates (required, merge-blocking).
      #   - Preview transaction + stdio: fake collector/local HTTP; no chromium.
      #   - Evidence stdio pure-path: contract/path validation that never
      #     reaches `from playwright.sync_api import sync_playwright`; runs
      #     with or without chromium (always required).
      #   - Evidence stdio capture: real-browser captures; needs chromium.
      #   - Playwright chromium install is the DEFAULT path. If the install
      #     step fails, the capture group is skipped-with-reason AND the gate
      #     is marked red (never silent green). See ticket 06 decision (b).
      # ----------------------------------------------------------------

      - name: Install pytest (for stdio gates)
        run: python3 -m pip install pytest

      - name: Documentation portability and Git boundary tests
        run: python3 -m pytest tests/test_doc_links.py -q

      - name: Read-only frontend scope review
        run: python3 -m pytest tests/test_frontend_review.py -q

      - name: Validator import and CLI stream contract
        # tests/test_validate_import.py is a pytest module, so the script list
        # above cannot reach it: importing the validator must not validate or
        # reconfigure the caller's streams, and main() must be repeatable.
        run: python3 -m pytest tests/test_validate_import.py -q

      - name: Piped-stdout encoding (every entry point, non-UTF-8 code pages)
        # T-105: static net (every entry point wires the one seam) plus a sweep
        # of every entry point under cp1252 / shift_jis / gbk.
        run: python3 -m pytest tests/test_stdio_encoding.py -q

      - name: Shared transport + Preview/Evidence/Console tests (required, no chromium)
        # Directory collection, not a hand-kept file list: a module joins this
        # gate the moment it lands in the tree. Modules that drive a real
        # browser declare the `browser` marker and run in the chromium job
        # below; this job installs pytest only, so a browser module that forgot
        # the marker fails loudly here instead of silently never running.
        run: |
          python3 -m pytest \
            packages/design-playbook/mcp/test_transport.py \
            packages/design-playbook/tests \
            -m "not browser" \
            -v

      - name: Workbench — pure-Python tests (required, no Playwright)
        # The workbench suite runs a real loopback service over real
        # temporary directories: path/identity/alias rules, transport and
        # credential negatives, mutation and proposal idempotency, apply
        # recovery, and packaging. test_ui_browser.py is wholly browser tests
        # (module-scope Playwright import) and is excluded. test_preview.py is
        # mixed: its pure urllib PreviewOriginHttpTest must run here, so only
        # its PreviewBrowserTest class is deselected by name (same split as
        # Evidence PurePathTests / CaptureTests below). Chromium is launched
        # inside PreviewBrowserTest, not at module scope, so collection here
        # never needs Playwright.
        run: |
          python3 -m pytest packages/design-playbook-workbench/tests \
            --ignore=packages/design-playbook-workbench/tests/test_ui_browser.py \
            -k "not PreviewBrowserTest" \
            -q

      - name: Owner projection publisher — R12 thin interface (required)
        # The owner-side writer for the projection document the workbench
        # reads. The cross-package round trip (publish -> list/read/freshness)
        # is covered by the workbench suite's integration test.
        run: python3 packages/design-playbook/tests/test_publish_owner_projection.py

      - name: Evidence MCP stdio — pure-path tests (required, no Playwright)
        # Direct runtime tests cover argument rejection, containment,
        # run-root warnings, and overwrite behavior through
        # execute_capture_plan with a fake browser adapter. Narrow stdio tests
        # cover only schema and JSON-RPC transport behavior. Neither needs
        # Chromium.
        # Selection is by class name (review item M3): every test in
        # EvidencePurePathTests runs here; EvidenceCaptureTests runs in the
        # chromium gate below. Unlike the previous -k keyword OR-list, new
        # tests are picked up automatically by their class — no
        # hand-maintained list to silently drift out of sync (the old list
        # silently skipped any new test whose name matched no keyword).
        # Note: -k PurePathTests (not -k Capture on the other gate) because
        # `test_tools_list_exposes_execute_capture_plan` is a pure-path
        # test whose method name contains "capture"; filtering on the full
        # class-name suffix keeps the two groups disjoint.
        run: |
          python3 -m pytest packages/design-playbook/tests/evidence/test_server_stdio.py -v \
            -k PurePathTests

      - name: Install Playwright + chromium (ticket 06 default path)
        id: pw_install
        continue-on-error: true
        # chromium install method confirmed by ticket 05 codex_exec smoke
        # (2026-07-22 PASS). Standard `playwright install --with-deps
        # chromium` on ubuntu-latest (passwordless sudo for --with-deps
        # apt libs). If the runner image or base changes, revisit.
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Evidence MCP stdio — capture tests (require chromium)
        if: steps.pw_install.outcome == 'success'
        # Real-browser captures: screenshot, a11y tree, interaction trace,
        # select_option, failure paths, overwrite opt-in. The `browser` marker
        # selects EvidenceCaptureTests and leaves the no-chromium classes to
        # the required gate above, so the two groups stay disjoint.
        run: |
          python3 -m pytest packages/design-playbook/tests/evidence -m browser -v

      - name: Playwright missing — skip-with-reason, mark gate red
        if: steps.pw_install.outcome != 'success'
        # Decision (b): CI installs chromium by default. On missing, the
        # capture group is SKIPPED with a printed reason and this gate is
        # marked RED — never silent green. The pure-path group above still
        # ran and is required independent of chromium availability.
        run: |
          echo "::error::Playwright/chromium install failed; Evidence capture tests skipped-with-reason."
          echo "Per ticket 06 decision (b): CI installs chromium by default."
          echo "On missing, the chromium capture group is skipped and this gate"
          echo "is marked red (NOT silent green). Pure-path Evidence tests already ran."
          exit 1

      - name: Frontend floor (ADR-0008 JS verification, required)
        # Graduated after the Playwright install and Evidence capture group
        # ran green on main (run 30165093470). This exercises the preview
        # control's browser-side submit/readiness contract.
        if: steps.pw_install.outcome == 'success'
        run: |
          python3 packages/design-playbook/tests/test_floor_frontend.py \
            | tee /tmp/frontend-floor.log
          grep -Fx "FRONTEND FLOOR TEST PASSED" /tmp/frontend-floor.log

      - name: Pin-to-annotate sync e2e (require chromium)
        # #56/#57/#58: parent<->bridge state sync on the real sandbox path —
        # pin state, badges, locate, removal/undo reconciliation. Also asserts
        # the T-106 React direct editor on that same real path (selection,
        # style+layout pending edits, undo without duplicate enqueue).
        if: steps.pw_install.outcome == 'success'
        run: |
          python3 packages/design-playbook/tests/test_pin_sync_frontend.py \
            | tee /tmp/pin-sync.log
          grep -Fx "PIN SYNC E2E TEST PASSED" /tmp/pin-sync.log

      - name: Preview browser suites (require chromium)
        if: steps.pw_install.outcome == 'success'
        # T-110 acceptance plus every other preview module that drives a real
        # browser: host appliers, reconnect/drain, anchor floor, live route,
        # criteria locale, visual-UI regressions. Same marker the required gate
        # filters on, so no list here can fall behind the tree.
        run: |
          python3 -m pytest packages/design-playbook/tests/preview -m browser -v

      - name: Queue monitor dialog timer races (require chromium)
        if: steps.pw_install.outcome == 'success'
        run: |
          python3 -m pytest packages/design-playbook/tests/test_queue_monitor.py -v

      - name: Run Console — browser tests (require chromium)
        if: steps.pw_install.outcome == 'success'
        run: |
          python3 -m pytest packages/design-playbook/tests/run_console -m browser -v

      - name: Workbench — browser journeys (require chromium)
        if: steps.pw_install.outcome == 'success'
        # test_ui_browser.py is wholly browser tests; from the mixed
        # test_preview.py only PreviewBrowserTest runs here — its pure
        # PreviewOriginHttpTest already ran in the required gate above, so the
        # two groups stay disjoint.
        run: |
          python3 -m pytest \
            packages/design-playbook-workbench/tests/test_ui_browser.py \
            -q
          python3 -m pytest \
            packages/design-playbook-workbench/tests/test_preview.py \
            -q -k PreviewBrowserTest

      - name: Preview canvas version-control e2e (require chromium)
        if: steps.pw_install.outcome == 'success'
        run: |
          python3 -m pytest packages/design-playbook/tests/test_e2e_canvas_vc.py -v
          python3 -m pytest packages/design-playbook/tests/preview/test_preview_usability.py -v

      - name: Operator continuation — extra-project journey (require chromium)
        id: operator_journey
        if: steps.pw_install.outcome == 'success'
        timeout-minutes: 5
        # Real CLI, browser, clipboard, provider captures, strict validation,
        # and handoff archive. Simulated review inputs are not trial evidence.
        run: |
          mkdir -p .scratch
          python3 -m pytest tests/test_operator_continuation_e2e.py -v \
            --basetemp=.scratch/operator-ci \
            --junitxml=.scratch/operator-ci-results.xml

      - name: Upload operator journey evidence
        if: always() && (steps.operator_journey.outcome == 'success' || steps.operator_journey.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: operator-continuation-evidence
          path: |
            .scratch/operator-ci
            .scratch/operator-ci-results.xml
          # Only synthetic disposable test data, including its nested run root.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  powershell-quoting:
    # The ubuntu matrix runs every t002 test except the PowerShell
    # round-trip class (skipIf os.name != "nt"): quoting regressions
    # (statement splitting, interpolation, empty-argv shifts) are only
    # caught by a real PowerShell parser. The read-only frontend review
    # resolves drive letters, backslashes and case-insensitive paths, so
    # its filesystem semantics need a real Windows runner too.
    name: PowerShell quoting regression (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run-status continuation tests against a real PowerShell
        run: python tests/test_t002_run_status_continuation.py
      - name: Install pytest (read-only frontend review)
        run: python -m pip install pytest
      - name: Read-only frontend scope review on Windows paths
        run: python -m pytest tests/test_frontend_review.py -q
      - name: Preview origin exclusivity (ADR-0046)
        # SO_REUSEADDR makes a second bind alias a live port on Windows only, so
        # this regression can only fail on a real Windows runner. It lives in a
        # module the no-chromium gate also collects, hence the class selection.
        run: |
          python -m pytest packages/design-playbook/tests/preview/test_browser_control.py \
            -q -k PreviewServerBindIsolationTests

  workbench-python312:
    # R15 names Python 3.12 as the main target. The `validate` job runs the
    # workbench suite on the runner's default `python3`, which is not a pinned
    # 3.12; this job pins the interpreter explicitly so the portable-logic
    # evidence is bound to the target version rather than an inherited one.
    # It is additive: no existing job is modified by it.
    name: Workbench — Python 3.12 target interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and ruff
        run: |
          RUFF_VERSION=$(python -c "import sys; sys.path.insert(0, 'scripts'); from _checks import RUFF_VERSION; print(RUFF_VERSION)")
          python -m pip install --disable-pip-version-check pytest "ruff==${RUFF_VERSION}"
      - name: Workbench — pure-Python tests on Python 3.12
        # Same split as the required gate above: exclude the wholly-browser
        # file, deselect only PreviewBrowserTest from the mixed file. No
        # Playwright install in this job, so this proves the pure path needs
        # none.
        run: |
          python -m pytest packages/design-playbook-workbench/tests \
            --ignore=packages/design-playbook-workbench/tests/test_ui_browser.py \
            -k "not PreviewBrowserTest" \
            -q
      - name: Workbench — ruff on Python 3.12
        run: python -m ruff check packages/design-playbook-workbench
      - name: Record the interpreter actually used
        run: python --version
