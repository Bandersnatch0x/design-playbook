name: Release dsh-design-playbook

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to recover"
        required: true
        type: string
      recovery:
        description: "Verify an existing npm artifact without republishing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-dsh-bundle-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish dsh-design-playbook
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery || false }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      package_name: ${{ steps.release.outputs.package_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Pin Trusted Publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.19.0"

      - name: Resolve and bind release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${TAG}" 2>/dev/null || true)"
          git fetch origin main:refs/remotes/origin/main --no-tags
          MAIN_COMMIT="$(git rev-parse refs/remotes/origin/main)"
          HEAD_IS_ANCESTOR=false
          if git merge-base --is-ancestor "${HEAD_COMMIT}" "${MAIN_COMMIT}"; then
            HEAD_IS_ANCESTOR=true
          fi
          python3 scripts/release_transaction.py identity \
            --tag "${TAG}" \
            --manifest packages/dsh-design-playbook/package.json \
            --head-commit "${HEAD_COMMIT}" \
            --tag-commit "${TAG_COMMIT}" \
            --main-commit "${MAIN_COMMIT}" \
            --head-is-ancestor "${HEAD_IS_ANCESTOR}" \
            --recovery "${RECOVERY}" \
            >> "${GITHUB_OUTPUT}"

      - name: Run release group gate
        # Lockstep policy only: both package versions equal the tag version
        # and the DSH dependency is exactly ^X.Y.Z. Main-package surface
        # checks (README badges, release notes, marketplace) belong to the
        # main workflow's full gate, not to the DSH publisher (spec 7/8/17).
        run: python3 scripts/release.py --checks release-group

      - name: Validate dsh bundle structure
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR="packages/dsh-design-playbook"
          # Verify the bundle declares dsh.bundle.patch
          node -e "
            const pkg = require('./${PKG_DIR}/package.json');
            if (!pkg.dsh?.bundle?.patch) throw new Error('no dsh.bundle.patch');
            if (pkg.dsh.bundle.patch !== './cordis.patch.yml') throw new Error('patch path mismatch');
            console.log('bundle structure OK');
          "
          # Verify cordis.patch.yml exists and bridges both MCP servers
          test -f "${PKG_DIR}/cordis.patch.yml"
          grep -q "design-playbook-preview-mcp" "${PKG_DIR}/cordis.patch.yml"
          grep -q "design-playbook-evidence-mcp" "${PKG_DIR}/cordis.patch.yml"
          grep -q "@deepseek-ai/dsh-mcp-client" "${PKG_DIR}/cordis.patch.yml"
          echo "bundle patch OK"

      - name: Inspect npm artifact
        working-directory: packages/dsh-design-playbook
        run: npm pack --dry-run

      - name: Wait for design-playbook registry
        timeout-minutes: 36
        run: >-
          python3 scripts/release_transaction.py wait-registry
          --package design-playbook
          --version "${{ steps.release.outputs.version }}"
          --attempts 180
          --interval 10

      - name: Check npm registry state
        id: registry
        run: |
          set +e
          python3 scripts/release_transaction.py registry-state \
            --package "${{ steps.release.outputs.package_name }}" \
            --version "${{ steps.release.outputs.version }}" \
            > registry-state.txt
          STATUS=$?
          set -e
          cat registry-state.txt
          if [[ ${STATUS} -ne 0 ]]; then exit ${STATUS}; fi
          cat registry-state.txt >> "${GITHUB_OUTPUT}"

      - name: Validate public release state transition
        id: state
        env:
          EVENT_NAME: ${{ github.event_name }}
          NPM_EXISTS: ${{ steps.registry.outputs.exists }}
        run: |
          python3 scripts/release_state.py package-state \
            --event-name "${EVENT_NAME}" \
            --recovery "${RECOVERY}" \
            --npm-exists "${NPM_EXISTS}" \
            >> "${GITHUB_OUTPUT}"

      - name: Publish npm package with OIDC
        if: steps.state.outputs.action == 'publish'
        working-directory: packages/dsh-design-playbook
        run: npm publish --access public

      - name: Verify npm registry
        run: >-
          python3 scripts/release_transaction.py wait-registry
          --package "${{ steps.release.outputs.package_name }}"
          --version "${{ steps.release.outputs.version }}"
          --attempts 18
          --interval 5

      - name: Verify npm provenance
        run: >-
          python3 scripts/release_transaction.py verify-provenance
          --package "${{ steps.release.outputs.package_name }}"
          --version "${{ steps.release.outputs.version }}"
          --attempts 3
          --interval 20

      - name: npm publish summary
        shell: bash
        run: |
          {
            echo "## npm publish"
            echo ""
            echo "- package: ${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.version }}"
            echo "- tag: ${{ steps.release.outputs.tag }}"
            echo "- preexisting: ${{ steps.registry.outputs.exists }}"
            echo "- action: ${{ steps.state.outputs.action }}"
          } >> "${GITHUB_STEP_SUMMARY}"
