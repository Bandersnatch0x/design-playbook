<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>off-scale render</title>
<!-- Bound declaration: fontSizes 14/16/20/24 px;
     palette #f5f5f5 #ffffff #1a1a1a #0b6bcb; radii 4/8/12/20 px.
     Negative example: every declaration is a declared token or a relative
     unit, so a source-only reading finds nothing off-scale. The deviation
     exists only after layout: 1rem resolves through a 106.25% root, the two
     nested radii ignore the concentric relation, and the link keeps the
     user-agent colour because the sheet never declares one. -->
<style>
  :root {
    --canvas: #f5f5f5;
    --surface: #ffffff;
    --text: #1a1a1a;
    --font-body: 1rem;
    --font-title: 24px;
    --radius-outer: 12px;
    --radius-xl: 20px;
  }
  html { font-size: 106.25%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text);
    font-size: var(--font-body);
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius-outer);
    padding: 8px;
  }
  .title { font-size: var(--font-title); margin: 0 0 8px; }
  .inner { border-radius: var(--radius-outer); }
  .deep { border-radius: var(--radius-xl); }
</style>
</head>
<body data-state="ok">
  <div class="card">
    <h1 class="title">On-scale heading</h1>
    <p class="inner">Nested copy one level in.</p>
    <p class="deep">Nested copy with a larger radius.</p>
    <p><a href="#">Unstyled link</a></p>
  </div>
</body>
</html>
