<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>declared tokens only</title>
<!-- Bound declaration: fontSizes 14/16/20/24 px;
     palette #f5f5f5 #ffffff #1a1a1a #0b6bcb; radii 4/8/12/20 px.
     Positive example: every computed value resolves to a declared value. -->
<style>
  :root {
    --canvas: #f5f5f5;
    --surface: #ffffff;
    --text: #1a1a1a;
    --font-body: 16px;
    --font-title: 20px;
    --radius-outer: 12px;
    --radius-inner: 4px;
  }
  html { font-size: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text);
    font-size: var(--font-body);
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius-outer);
    padding: 8px;
  }
  .title { font-size: var(--font-title); margin: 0 0 8px; }
  .inner { border-radius: var(--radius-inner); margin: 0; }
</style>
</head>
<body data-state="ok">
  <div class="card">
    <h1 class="title">Declared heading</h1>
    <p class="inner">Nested copy inside the card.</p>
  </div>
</body>
</html>
