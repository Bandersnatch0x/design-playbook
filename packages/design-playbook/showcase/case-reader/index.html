<script>
const DOCS = [{"id": "a-spec", "title": "明确需求", "kind": "Case A / 需求声明", "src": "showcase/01-spec.md", "sha": "c1f4fdf7b6684abc15886457330b929a058aaba70a3f782478ce3ad4ed45d67f", "text": "# Spec - SwarSight simulation run queue\r\n\r\nProduced by **ux-spec**. Domain grounded in SwarSight `DESIGN.md` + `WorkbenchPage` (simulation control: start/pause/resume/stop; scenarios; entities; decision audit).\r\n\r\n## L1 定位与意图\r\n\r\n- 一句话定义：查看所有模拟运行的实时状态、失败重试与资源占用的队列监控页。\r\n- 目标用户：运维分析师、场景设计者。\r\n- 场景：日常监控在跑模拟；失败批量重试；资源异常定位。\r\n- 非目标：不在此编辑场景；不承载完整决策审计（在 Workbench）。\r\n- 行为边界：重试 = 询问后；中止运行中模拟 = 询问后；查看明文敏感参数 = 永不（默认脱敏）。\r\n\r\n## L2 信息架构\r\n\r\n- 顶栏：运行中 / 失败 / 排队 / 已完成 计数 + 时间窗筛选。\r\n- 主区：运行列表（状态、场景名、触发人、耗时、资源占用、操作）。\r\n- 侧区：失败趋势、队列压力、最近失败原因。\r\n- 操作条：批量重试、批量中止（选中后浮现）。\r\n\r\n## L3 核心链路\r\n\r\n- queued -> running -> completed\r\n- running -> paused -> running\r\n- running -> failed -> retry -> queued\r\n- running -> failed -> aborted\r\n- running -> timeout -> retry / abort\r\n\r\n## L4 组件功能细节\r\n\r\n- 状态 Badge：queued / running / paused / failed / completed / aborted / timeout。\r\n- 行操作：查看详情（Drawer）、重试、中止。\r\n- 资源占用：mini sparkline（CPU/内存），只读。\r\n- 批量条：选中失败项 -> 批量重试（二次确认）。\r\n\r\n## L5 边界条件\r\n\r\n- 空态：无运行 -> 「还没有模拟运行」+ 创建场景入口（非白屏）。\r\n- 加载态：表结构骨架（SwarSight Abyss Canvas 底，不塌布局）。\r\n- 错误态：模拟服务不可达 -> 原因 + 重试；单条重试失败 -> 行内错误 + 可再试。\r\n- 权限降级：viewer 角色禁用重试/中止，tooltip 说明所需权限。\r\n\r\n## L6 验收标准\r\n\r\n- Given 一条 failed，When 展开详情，Then 可见失败原因 + 资源峰值，且可触发重试。\r\n- Given 一条 failed，When 重试成功，Then 行转 queued 并可刷新到 running/completed。\r\n- Given 无运行，When 打开运行列表，Then 非白屏空态 + CTA。\r\n- Given viewer，When 查看运行操作，Then 重试/中止不可执行且有原因。\r\n- Given 批量重试，When 提交执行，Then 二次确认 + 后果文案后才执行。\r\n"}, {"id": "a-decision", "title": "确认方向", "kind": "Case A / 设计决策", "src": "showcase/02-decision-report.md", "sha": "9c764c410ec949eea91af355f2e69235b20a8149588f32931171ba5336165e52", "text": "# Decision report - SwarSight simulation run queue\n\nProduced by **ui-picker**, before any code. Grounded in SwarSight `DESIGN.md` tokens (Abyss Canvas #080A0D, Graphite Surface #0D1117, Signal Cyan #2DD4BF accent, Amber Evidence #F2C94C warnings; cockpit-dense; no emojis; no neon/glow; transform/opacity motion only).\n\n```text\nscene: ops list / dashboard (simulation run queue)\ndensity: cockpit-dense (8/10 per DESIGN.md)\ntemplate: ops list — summary + main run list + side trends + batch action bar\nregions:\n  top: running/failed/queued/completed counts + time-window filter\n  main: run list (state, scenario, owner, duration, resource sparkline, actions)\n  side: failure trend, queue pressure, recent failure causes\n  actions: batch retry / abort (appears on selection)\ncomponents:\n  run state        -> Badge (queued/running/paused/failed/completed/aborted/timeout)\n  failed / timeout -> Amber Evidence color (DESIGN.md warning role), not red neon\n  resource usage   -> read-only mini sparkline (Tag-style chip, not a card)\n  scenario / owner -> text + muted telemetry color\n  retry            -> Button (recovery action, not a Tag)\n  abort            -> Button (danger, confirm-gated)\n  run detail       -> Drawer (dense read-only, not a Dialog: non-interrupt)\n  batch retry      -> Button in action bar + confirm Dialog (interrupt)\nrisks:\n  - retry/abort without confirm -> domain dangerous op (blocking if missing)\n  - sensitive sim params in detail -> mask by default (domain)\n  - resource sparkline animating width -> violates DESIGN.md \"no width animation\" (craft/design)\n  - viewer can retry -> spec L5 permission gap\ntokens:\n  bg: var(--abyss-canvas) / panel: var(--graphite-surface) / border: var(--ash-border)\n  accent: var(--signal-cyan) (single accent, selected/focus/primary only)\n  warning: var(--amber-evidence)\n  text: var(--cold-ink) / muted: var(--muted-telemetry)\n  no emojis, no glow, no purple-blue gradients (DESIGN.md anti-patterns)\n```\n\nDo not start implementation until this report exists. Confirmed present -> proceed to fill.\n"}, {"id": "a-review", "title": "验收与修复", "kind": "Case A / 回流闭环", "src": "showcase/03-point-back.md", "sha": "659c5ee67a270be0a36c4d771dbfc2d04e8e736a6a4f55c6ec7a887c8b17d95f", "text": "# Point-back findings + recirculate closure - SwarSight run queue\r\n\r\nProduced by **ui-evaluator** against the decision report + spec. Every finding points back to a declaration; blocking findings show a closure trail.\r\n\r\n## Findings\r\n\r\n```text\r\nissue:    batch retry has no confirm step\r\nsource:   domain\r\nfix:      confirm Dialog with consequence copy before executing batch retry\r\nseverity: S3\r\ndisposition: blocking\r\n\r\nissue:    abort run without confirm\r\nsource:   domain\r\nfix:      confirm Dialog; abort is irreversible -> state consequence\r\nseverity: S3\r\ndisposition: blocking\r\n\r\nissue:    resource sparkline animates width on update\r\nsource:   craft (DESIGN.md §6: no width/height/top/left animation)\r\nfix:      animate opacity/transform only; re-render data in place\r\nseverity: S3\r\ndisposition: blocking\r\n\r\nissue:    failed state uses red neon\r\nsource:   craft (DESIGN.md §7: no neon/glow; warning role = Amber Evidence)\r\nfix:      use var(--amber-evidence), no outer glow\r\nseverity: S1\r\n\r\nissue:    viewer can click retry (no permission gate)\r\nsource:   spec L5\r\nfix:      disable retry/abort for viewer role + tooltip reason\r\nseverity: S1\r\n\r\nissue:    emoji status icons in list\r\nsource:   craft (DESIGN.md §7: no emojis)\r\nfix:      Badge text only\r\nseverity: S1\r\n```\r\n\r\n## Evidence ledger\r\n\r\n```text\r\ncriterion: L6.1\r\nrequired: rendered failed-row detail shows reason, resource peak, and retry\r\nobserved: evaluator report records all three in the expanded Swarsight run row\r\nresult: pass\r\n\r\ncriterion: L6.2\r\nrequired: interaction trace shows retry success moving failed to queued and onward\r\nobserved: evaluator report records failed -> queued -> running/completed states\r\nresult: pass\r\n\r\ncriterion: L6.3\r\nrequired: rendered no-runs state is non-blank and exposes a next-step CTA\r\nobserved: evaluator report records the empty-state message and CTA\r\nresult: pass\r\n\r\ncriterion: L6.4\r\nrequired: viewer retry and abort controls are unavailable with an explanation\r\nobserved: evaluator report records disabled viewer actions and their reason\r\nresult: pass\r\n\r\ncriterion: L6.5\r\nrequired: batch retry executes only after consequence-bearing confirmation\r\nobserved: closure trails record confirmation copy before retry and abort execution\r\nresult: pass\r\n```\r\n\r\n## Positive findings\r\n\r\n- All five L6 criteria pass in the Evidence ledger above (failed-row detail, retry state trace, empty-state CTA, viewer gating, confirm-before-batch-retry).\r\n- Every finding is declaration-grounded (`domain` / `spec` L5 / `craft` DESIGN.md tokens) — none required free-floating judgment.\r\n\r\n## Recirculate closure trail\r\n\r\n- closes: batch retry has no confirm step -> reopen `domain` -> fix: confirm Dialog + consequence -> re-eval: confirm present before execute -> **0 blocking**\r\n- closes: abort run without confirm -> reopen `domain` -> fix: confirm Dialog + irreversibility copy -> re-eval: confirm gates abort -> **0 blocking**\r\n- closes: resource sparkline animates width on update -> reopen `craft`/`design` -> fix: opacity/transform only, data re-rendered in place -> re-eval: no width animation -> **0 blocking**\r\n- S1: failed red neon -> reopen `craft` -> fix: var(--amber-evidence) no glow -> re-eval: amber warning role -> resolved\r\n- S1: viewer retry ungated -> reopen `spec` L5 -> fix: disable + tooltip -> re-eval: viewer cannot retry -> resolved\r\n- S1: emoji icons -> reopen `craft` -> fix: Badge text -> re-eval: no emojis -> resolved\r\n\r\n## Coverage statement\r\n\r\n必审: primary path findings 6/6 complete\r\n未审: none (single-viewport walkthrough)\r\n\r\n## Limitations statement\r\n\r\n- Single-viewport walkthrough of the queue page; findings derive from declaration-grounded inspection of rendered states, with no involved-user evidence.\r\n\r\n## Verdict\r\n\r\n**Pass.** Zero blocking after recirculate closure (3 blocking -> fixed -> re-checked -> 0). All six dogfood gates green. The plugin produced a declaration-grounded critique with a closed recirculate trail on a real third-party codebase.\r\n"}, {"id": "b-confirm", "title": "人工确认记录", "kind": "Case B / 入驻表单确认", "src": "showcase/04-preview-hitl.md", "sha": "cc77fe1e2e63a111e710217cd70653aec8459a307c6a4a6533889f42e1e40991", "text": "# 04 · preview* HITL 演示（源自 dogfood 007，非主案例 ask）\n\n> **来源声明（honest framing）：** 本节的 preview\\* confirm + round 产物**不是**上方主案例（SwarSight 模拟运行队列监控页）的产物，而是取自 **v0.4 dogfood 007「企业入驻多步表单」**（`.scratch/design-playbook-v0/dogfood/2026-07-20-007-multi-step-form/`）的真实 HITL 运行。它单独演示 `preview*` 步骤（G5）如何在一个**不同 ask** 的产品 UI 上收敛——补 showcase 此前\"声明存在但未证明 HITL 可收敛\"的缺口（01 决策 1a/1b）。主案例（01–03）仍是 G1–G4 的单一深案例；`observe*` evidence 暂留 dogfood 日志，未进 showcase（体积 + 漂移负担，待稳定 fixture 化）。\n\n## preview* 是什么\n\n`ui-picker` 决策报告出炉后、进入 Fill 前，编排器探测 MCP `preview_prototype`；若 adapter 在场，生成一次性结构语义原型 HTML，弹窗由**人**确认/修改（HITL），adapter 落盘 confirm json（ADR-0008 feedback floor：非空 feedback 或 ≥1 anchor 触发，且每个 anchor 有非空 selector+comment）。G5 要求一份 `confirmed=true` **且** `floor_pass=true` 的 confirm，其 `report_ref` 指向当前 decision report。\n\n## 本演示的 4 轮 HITL 轨迹（人审，非 mock）\n\n| round | 决定 | feedback / anchor | floor | 说明 |\n| --- | --- | --- | --- | --- |\n| 1 | 需要修改 | `安师大安师大是`（无 anchor） | pass | ADR-0008 语义垃圾串——结构 floor 放行（非空触发），零可执行信号；语义判定属 evaluator，非 floor |\n| 2 | 需要修改 | `[select #s] 需要修改字体` | pass | 真实 anchor（新证据）→ round-3 修 select/option 字体继承 |\n| 3 | 需要修改 | `[#c] 改为一行两个` | pass | 真实 anchor（新证据）→ round-4 改 step1 两列行 |\n| 4 | **确认通过** | 2 carry-forward anchor（按钮位置、手机 label 同行） | pass | `confirmed=true + floor_pass=true` → **G5 满足** |\n\n完整轨迹见 [`log.md`](preview/log.md)；确认记录见 [`confirm-round-4.json`](preview/confirm-round-4.json)；精选原型见 [`round-1.html`](preview/round-1.html)（round-1 revise 原型）与 [`round-4.html`](preview/round-4.html)（被确认的原型）；决策报告见 [`decision-report.md`](preview/decision-report.md)。\n\n## 关键契约在真人 HITL 下的实证\n\n- **floor = 结构，semantic = evaluator**：round-1 真人喂语义垃圾，floor 结构性放行；编排器不臆造迎合性改动，按 decision report 自洽收紧结构。ADR-0008 分层在真人环成立。\n- **capture≠judge 的对照**：confirm json 只记录\"人确认了 + floor 过\"，不判 UI 好坏；UI 验收是后续 ui-evaluator 的事（见 007 point-back）。\n- **G5 非更高级 prompting**：是 adapter 写的机器可检记录（confirmed + floor_pass + report_ref 匹配），下方命令证明。\n\n## 机器可检（G5）\n\n```bash\npython packages/design-playbook/scripts/validate_run.py \\\n  packages/design-playbook/showcase/01-spec.md \\\n  packages/design-playbook/showcase/03-point-back.md \\\n  --preview-dir packages/design-playbook/showcase/preview \\\n  --decision-report packages/design-playbook/showcase/preview/decision-report.md\n# → RUN OK（G1–G4 沿用主案例 spec/point-back；G5 校验 preview/confirm-round-4.json）\n```\n\n`tests/test_validate_run.py` 的 `showcase/preview-g5` 用例直接跑此校验。\n"}];
</script>
<script>
(function(){
'use strict';
var BOUNDARIES = {
 'a-spec':     '历史案例 A 的规格记录。它不是当前项目的规格，也不能替任何后续确认背书。',
 'a-decision': '历史案例 A 的实现前决策。决策先于代码，不构成验收结论。',
 'a-review':   '历史案例 A 的评审与修复闭环，其结论只覆盖当时的版本与视口。',
 'b-confirm':  '独立案例 B 的确认记录，与案例 A 是两个不同需求，不能互相背书。',
 'c-status':   '当前命令文档，说明可用入口；不代表任何一次实际接续发生了。',
 'c-handoff':  '当前命令文档，说明交付入口；不代表本页或任何案例已交付验收。'
};
var COMMAND_DOCS = [
 {id:'c-status', title:'04 · 中断接续', kind:'命令说明 / 非实跑结果', src:'commands/run-status.md', excerpt:'报告一次 Design I/O 运行的阶段、阻塞与下一步接续动作。用法：python <plugin>/scripts/run_status.py [.scratch/<run>] [--json] [--list]。命令只读运行产物，不启动服务器；Done when：指明已完成阶段标记、任何活动阻塞与唯一有效的下一步动作。'},
 {id:'c-handoff', title:'05 · 静态交付', kind:'命令说明 / 非实跑结果', src:'commands/run-handoff.md', excerpt:'为一次明确的运行构建静态交付包：python <plugin>/scripts/run_handoff.py <run> [--fill <path>] [--round N]。非流水线义务、非验收；Done when：交付 index.html 存在且 verdict / authority / confirmationSource 原样报告。'}
];
var ORDER = DOCS.map(function(d){return {id:d.id,title:d.title,kind:d.kind};}).concat(COMMAND_DOCS.map(function(d){return {id:d.id,title:d.title,kind:d.kind};}));
var TEXTS = {};
DOCS.forEach(function(d){TEXTS[d.id]=d;});
COMMAND_DOCS.forEach(function(d){TEXTS[d.id]=d;});
var nav = document.getElementById('toc');
ORDER.forEach(function(item){
  var a=document.createElement('a');
  a.href='#'+item.id; a.textContent=item.title;
  var s=document.createElement('small'); s.textContent=item.kind; a.appendChild(s);
  a.addEventListener('click',function(){select(item.id,false);});
  nav.appendChild(a);
});
var current=null;
function byId(id){return document.querySelector('nav a[href="#'+CSS.escape(id)+'"]');}
function select(id,fromHash){
  var link=byId(id);
  if(!link){showError(id);return;}
  nav.querySelectorAll('a').forEach(function(a){a.removeAttribute('aria-current');});
  link.setAttribute('aria-current','page');
  document.getElementById('doc-view').style.display='';
  document.getElementById('error-view').style.display='none';
  var d=TEXTS[id];
  document.getElementById('kind').textContent=d.kind;
  document.getElementById('document-title').textContent=d.title;
  document.getElementById('boundary').textContent=BOUNDARIES[id]||'';
  var sha=d.sha?('SHA-256: '+d.sha):'';
  document.getElementById('source').textContent='来源: '+d.src+(sha?'\n'+sha:'');
  document.getElementById('excerpt').textContent=d.text||d.excerpt;
  current=id;
  if(fromHash||history.replaceState){try{history.replaceState(null,'','#'+id);}catch(e){}}
  document.getElementById('document-title').focus({preventScroll:false});
}
function showError(id){
  document.body.setAttribute('data-state','error');
  nav.querySelectorAll('a').forEach(function(a){a.removeAttribute('aria-current');});
  current=null;
  document.getElementById('doc-view').style.display='none';
  document.getElementById('error-view').style.display='block';
  document.getElementById('error-view').querySelector('a').href='#'+(ORDER[0].id);
  if(id&&id!=='')document.getElementById('error-title').textContent='未找到该材料: '+id;
  try{history.replaceState(null,'','');}catch(e){}
  document.getElementById('error-title').focus();
}
var search=document.getElementById('search');
var hint=document.getElementById('search-hint');
search.addEventListener('input',function(){
  var q=search.value.trim().toLowerCase(); var visible=0;
  ORDER.forEach(function(item){
    var hay=(item.title+' '+item.kind+' '+(TEXTS[item.id].src||'')).toLowerCase();
    var match=!q||hay.indexOf(q)!==-1;
    byId(item.id).hidden=!match; if(match)visible++;
  });
  var empty=q&&visible===0;
  document.body.setAttribute('data-state',empty?'empty':'ok');
  hint.style.display=empty?'block':'none';
  hint.querySelector('a').onclick=function(e){e.preventDefault();search.value='';search.dispatchEvent(new Event('input'));search.focus();};
});
window.addEventListener('hashchange',function(){var id=decodeURIComponent(location.hash.slice(1));select(id,true);});
var initial=decodeURIComponent(location.hash.slice(1));
select(initial||ORDER[0].id,true);
})();
</script>
</body></html>
