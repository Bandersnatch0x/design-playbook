<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local reading queue</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- visual-edit-bridge -->
</head>
<body>
  <main>
    <h1 id="queue-title">Reading queue</h1>
    <p>Two articles saved on this device. No account or network needed.</p>
    <article id="next-read">
      <h2>Designing for keyboard navigation</h2>
      <p>Start with the next action, then make its state visible.</p>
      <button type="button" onclick="this.textContent = 'Marked as read'">Mark as read</button>
    </article>
    <article><h2>Small, verifiable changes</h2><p>Review the diff before changing the source.</p></article>
  </main>
</body>
</html>
